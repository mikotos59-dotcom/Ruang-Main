<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruang Main</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<aside class="rail">
  <div class="brand">
    <img src="logo.svg" alt="" width="36" height="36">
    <span>Ruang Main</span>
  </div>
  <nav class="tabs" aria-label="Menu utama">
    <button class="tab" data-view="library" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h4v14H4zM10 5h4v14h-4zM16.5 5.6l3.8-1 3.4 13.5-3.8 1z"/></svg>Pustaka
    </button>
    <button class="tab" data-view="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10h4v10zm6 0V4h4v16zm6 0v-7h4v7z"/></svg>Statistik
    </button>
    <button class="tab" data-view="gallery">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3zm2 2v8l4-4 3 3 3-3 4 4V7zm10 1.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/></svg>Galeri
    </button>
  </nav>
  <div class="rail-foot">
    <button class="ghost" data-open="games">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3z"/></svg>Folder game
    </button>
    <button class="ghost" data-open="bios">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v4h3v14H4V7h3zm2 2v2h6V5zM7 11v2h10v-2zm0 4v2h7v-2z"/></svg>Folder BIOS
    </button>
    <button class="ghost" id="linksBtn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 13.4a1 1 0 0 1 0-1.4l3.5-3.5a3 3 0 1 1 4.2 4.2l-2 2-1.4-1.4 2-2a1 1 0 1 0-1.4-1.4L12 13.4a1 1 0 0 1-1.4 0zM13.4 10.6a1 1 0 0 1 0 1.4l-3.5 3.5a3 3 0 1 1-4.2-4.2l2-2 1.4 1.4-2 2a1 1 0 1 0 1.4 1.4L12 10.6a1 1 0 0 1 1.4 0z"/></svg>Tautan saya
    </button>
    <button class="ghost" id="aboutBtn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm-1 8v7h2v-7zm0-4v2h2V6z"/></svg>Tentang &amp; pengaturan
    </button>
  </div>
</aside>

<main id="main">
  <section id="view-library" class="view">
    <div id="hero"></div>
    <div class="toolbar">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
        <input id="search" type="search" placeholder="Cari game" autocomplete="off">
      </label>
      <div id="chips" class="chips" role="group" aria-label="Filter konsol"></div>
      <select id="sort" aria-label="Urutkan">
        <option value="recent">Terakhir dimainkan</option>
        <option value="name">Nama A–Z</option>
        <option value="time">Paling lama dimainkan</option>
        <option value="added">Baru ditambahkan</option>
      </select>
    </div>
    <div id="grid" class="grid"></div>
  </section>

  <section id="view-stats" class="view" hidden></section>
  <section id="view-gallery" class="view" hidden></section>
</main>

<div id="sheet" class="sheet" hidden></div>
<div id="lightbox" class="lightbox" hidden></div>
<dialog id="about"></dialog>
<dialog id="links"></dialog>
<aside id="dltray" class="dltray" hidden aria-live="polite"></aside>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
